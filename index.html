<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atatürk Portresi WebAR</title>
    <!-- Kararlı WebAR Kütüphaneleri -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #start-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #start-btn {
            padding: 15px 30px; font-size: 1.2rem; background: #e11d48; color: white;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }
        #info-text { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 0 20px;}
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="start-ui">
        <button id="start-btn">Kamerayı Aç ve Başlat</button>
        <p id="info-text">Uygulamanın sesli çalışabilmesi için lütfen butona dokunun Beliren kamera iznini onaylayın.</p>
    </div>

    <!-- WebAR Sahnesi -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
             embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- En Hızlı ve Sorunsuz Oynatma İçin Google Drive Video Linkiniz Optimize Edildi -->
        <video id="ar-video" src="https://google.com" 
               preload="auto" response-type="arraybuffer" loop="false" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Portre algılandığında videonun yerleşeceği alan -->
      
        <a-video src="#ar-video" width="1" height="1.33" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
        const startBtn = document.querySelector('#start-btn');
        const startUi = document.querySelector('#start-ui');
        const sceneEl = document.querySelector('a-scene');
        const videoEl = document.querySelector('#ar-video');
        const targetEntity = document.querySelector('#target-entity');

        startBtn.addEventListener('click', () => {
            startUi.style.display = 'none';
            sceneEl.systems["mindar-image-system"].start();
        });

        // Resim hedefi bulunduğunda videoyu oynat
        targetEntity.addEventListener("targetFound", event => {
            videoEl.play();
        });

        // Resim hedefi kaybedildiğinde videoyu duraklat
        targetEntity.addEventListener("targetLost", event => {
            videoEl.pause();
        });
    </script>
</body>
</html>
