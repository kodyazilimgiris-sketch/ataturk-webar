<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Atatürk Portresi WebAR</title>
    <!-- iOS Uyumlu Güvenli Kütüphaneler -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net"></script>
    <!-- Vimeo API Kütüphanesi -->
    <script src="https://vimeo.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #start-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #start-btn {
            padding: 16px 32px; font-size: 1.25rem; background: #e11d48; color: white;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 20px rgba(225, 29, 72, 0.5);
        }
        #info-text { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 0 20px; }
        #ar-video-container { display: none; }
    </style>
</head>
<body>

    <div id="start-ui">
        <button id="start-btn" onclick="arSisteminiBaslat()">Kamerayı Aç ve Başlat</button>
        <p id="info-text">Deneyimin sesli çalışabilmesi için lütfen butona dokunun ve kamera iznini onaylayın.</p>
    </div>

    <!-- %100 Reklamsız Vimeo Gömme Alanı -->
    <div id="ar-video-container">
        <!-- DIKKAT: Aşağıdaki 'VIMEO_VIDEO_ID' yerine Vimeo'dan aldığınız rakam kodunu yazın -->
        <iframe id="ar-video" src="1238680671" allow="autoplay"></iframe>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
             embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: false" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-video src="#ar-video" width="1" height="1.33" position="0 0 0" rotation="0 0 0"></a-video>
      
    </a-scene>

    <script>
        let vimeoPlayer;

        window.addEventListener('load', () => {
            const iframe = document.querySelector('#ar-video');
            vimeoPlayer = new Vimeo.Player(iframe);
        });

        function arSisteminiBaslat() {
            document.querySelector('#start-ui').style.display = 'none';
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.systems && sceneEl.systems["mindar-image-system"]) {
                sceneEl.systems["mindar-image-system"].start();
            }
        }

        const targetEntity = document.querySelector('#target-entity');

        targetEntity.addEventListener("targetFound", () => {
            if (vimeoPlayer) vimeoPlayer.play();
        });

        targetEntity.addEventListener("targetLost", () => {
            if (vimeoPlayer) vimeoPlayer.pause();
        });
    </script>
</body>
</html>
